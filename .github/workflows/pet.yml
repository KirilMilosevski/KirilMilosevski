name: Profile cat

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cat
  cancel-in-progress: false

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the v1 commit; the project lives at knowprasad/YourTomo (formerly prsdx/github-pet).
      - uses: knowprasad/YourTomo@988c75ee4f1ad5374d3ca692db4b307761776067
        with:
          username: KirilMilosevski
          display-name: Kiril
          # UTC offset in minutes for Skopje: 60 in winter (CET), 120 in summer (CEST).
          timezone-offset-minutes: "60"
          watched-repos: "Enterprise-k8s-platform"
          accent-color: "#2F81F7"
